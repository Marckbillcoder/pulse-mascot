query RunInput {
  cart {
    cost {
      totalAmount {
        amount
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        totalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
        }
      }
    }
    attribute(key: "_mascot_unlocked_tier") {
      value
    }
  }
}
