<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Outer Ring Glow -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Character Body Gradient -->
    <radialGradient id="orbBodyGrad" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Eye Glowing Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Shopify Green Accent Gradient -->
    <linearGradient id="shopifyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b087"/>
      <stop offset="100%" stop-color="#008060"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" rx="260" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow Rings -->
  <circle cx="600" cy="580" r="440" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.3"/>
  <circle cx="600" cy="580" r="480" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="16 24" opacity="0.2"/>

  <!-- Character Ground Shadow -->
  <ellipse cx="600" cy="980" rx="280" ry="46" fill="rgba(0, 0, 0, 0.55)" filter="url(#softShadow)"/>

  <!-- Pulse Aura Backing -->
  <circle cx="600" cy="580" r="330" fill="#6366f1" opacity="0.22" filter="url(#glowEffect)"/>

  <!-- Main Mascot Body -->
  <g filter="url(#softShadow)">
    <!-- Antenna -->
    <path d="M600 280 Q600 160 660 120" fill="none" stroke="#818cf8" stroke-width="32" stroke-linecap="round"/>
    <circle cx="670" cy="115" r="46" fill="#a5b4fc" filter="url(#glowEffect)"/>
    <circle cx="658" cy="103" r="16" fill="#ffffff" opacity="0.9"/>

    <!-- Side Cyber Ears / Headset -->
    <rect x="220" y="490" width="70" height="180" rx="35" fill="#4338ca"/>
    <rect x="910" y="490" width="70" height="180" rx="35" fill="#4338ca"/>
    <circle cx="255" cy="580" r="18" fill="#818cf8" opacity="0.8"/>
    <circle cx="945" cy="580" r="18" fill="#818cf8" opacity="0.8"/>

    <!-- Mascot Sphere Body -->
    <circle cx="600" cy="580" r="320" fill="url(#orbBodyGrad)"/>
    
    <!-- Spherical Highlight Refraction -->
    <ellipse cx="490" cy="380" rx="140" ry="70" transform="rotate(-28 490 380)" fill="rgba(255, 255, 255, 0.28)"/>

    <!-- High-Tech Curved Visor -->
    <rect x="330" y="440" width="540" height="280" rx="140" fill="url(#visorGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="8"/>

    <!-- Expressive Emotion Eyes (Happy / Alert) -->
    <!-- Left Eye Pupil Track -->
    <g class="eye-left">
      <ellipse cx="485" cy="570" rx="46" ry="68" fill="url(#eyeGrad)" filter="url(#glowEffect)"/>
      <ellipse cx="475" cy="545" rx="18" ry="24" fill="#ffffff" opacity="0.95"/>
      <circle cx="498" cy="590" r="10" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Right Eye Pupil Track -->
    <g class="eye-right">
      <ellipse cx="715" cy="570" rx="46" ry="68" fill="url(#eyeGrad)" filter="url(#glowEffect)"/>
      <ellipse cx="705" cy="545" rx="18" ry="24" fill="#ffffff" opacity="0.95"/>
      <circle cx="728" cy="590" r="10" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Cheerful Blushing Cheeks -->
    <ellipse cx="410" cy="650" rx="42" ry="22" fill="#f472b6" opacity="0.55"/>
    <ellipse cx="790" cy="650" rx="42" ry="22" fill="#f472b6" opacity="0.55"/>
  </g>

  <!-- Sparkles / Gamification Stars -->
  <!-- Top Right Gold Star -->
  <path d="M960 260 L980 320 L1040 340 L980 360 L960 420 L940 360 L880 340 L940 320 Z" fill="#fbbf24" filter="url(#glowEffect)"/>
  <!-- Top Left Emerald Star -->
  <path d="M220 280 L235 320 L275 335 L235 350 L220 390 L205 350 L165 335 L205 320 Z" fill="#34d399" filter="url(#glowEffect)"/>
  <!-- Bottom Right Mini Sparkle -->
  <circle cx="980" cy="740" r="18" fill="#ec4899" opacity="0.85"/>
  <circle cx="210" cy="720" r="14" fill="#60a5fa" opacity="0.85"/>

  <!-- Shopify Official Merchant Badge Pill (Bottom Center) -->
  <g filter="url(#softShadow)">
    <rect x="410" y="1010" width="380" height="90" rx="45" fill="url(#shopifyGrad)"/>
    <text x="600" y="1068" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1.5">
      BUILT FOR SHOPIFY
    </text>
  </g>
</svg>
